{% extends "base.html" %}

{% block title %}Add Account — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add Account</h1>
            <p class="auth-subtitle">Track a savings, debt, or investment account's balance.</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('add_account') }}">
                <div class="form-group">
                    <label for="name">Account Name</label>
                    <input type="text" id="name" name="name"
                           class="form-input" placeholder="e.g. HDFC Savings" maxlength="60"
                           value="{{ name or '' }}" required autofocus>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type" class="form-input" required>
                        <option value="" disabled {% if not type %}selected{% endif %}>Select a type</option>
                        {% for t in account_types %}
                        <option value="{{ t }}" {% if type == t %}selected{% endif %}>{{ t|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="balance">Balance (₹)</label>
                    <input type="number" id="balance" name="balance"
                           class="form-input" placeholder="0.00" step="0.01" min="0"
                           value="{{ balance or '' }}" required>
                </div>

                <button type="submit" class="btn-submit">Add Account</button>
                <a href="{{ url_for('accounts') }}" class="btn-cancel">Cancel</a>
            </form>
        </div>

    </div>
</section>

{% endblock %}
