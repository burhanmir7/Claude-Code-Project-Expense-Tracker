{% extends "base.html" %}

{% block title %}Edit Account — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Account</h1>
            <p class="auth-subtitle">Update this account's details.</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('edit_account', id=account.id) }}">
                <div class="form-group">
                    <label for="name">Account Name</label>
                    <input type="text" id="name" name="name"
                           class="form-input" placeholder="e.g. HDFC Savings" maxlength="60"
                           value="{{ account.name or '' }}" required autofocus>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type" class="form-input" required>
                        <option value="" disabled {% if not account.type %}selected{% endif %}>Select a type</option>
                        {% for t in account_types %}
                        <option value="{{ t }}" {% if account.type == t %}selected{% endif %}>{{ t|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="balance">Balance (₹)</label>
                    <input type="number" id="balance" name="balance"
                           class="form-input" placeholder="0.00" step="0.01" min="0"
                           value="{{ account.balance or '' }}" required>
                </div>

                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('accounts') }}" class="btn-cancel">Cancel</a>
            </form>
        </div>

    </div>
</section>

{% endblock %}
